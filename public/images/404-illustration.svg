<?xml version="1.0" encoding="UTF-8"?>
<svg width="240" height="240" viewBox="0 0 240 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="240" height="240" rx="16" fill="url(#bg)"/>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7FBFF"/>
      <stop offset="1" stop-color="#F1F6FB"/>
    </linearGradient>
    <radialGradient id="lens" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.6" stop-color="#E6F0FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#DCEAFE" stop-opacity="0.95"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- magnifying glass group -->
  <g transform="translate(40,36)" filter="url(#shadow)">
    <!-- lens -->
    <circle cx="72" cy="64" r="48" fill="url(#lens)" stroke="#9FB3FF" stroke-width="3"/>
    <!-- glare -->
    <ellipse cx="92" cy="48" rx="18" ry="10" fill="white" opacity="0.55" transform="rotate(-25 92 48)"/>
    <!-- handle -->
    <rect x="110" y="120" width="18" height="68" rx="9" transform="rotate(45 110 120)" fill="#6B7280"/>
    <rect x="115" y="126" width="10" height="56" rx="6" transform="rotate(45 115 126)" fill="#374151" opacity="0.18"/>
    <!-- center dot -->
    <circle cx="72" cy="64" r="8" fill="#0f172a" opacity="0.06"/>
  </g>
</svg>
